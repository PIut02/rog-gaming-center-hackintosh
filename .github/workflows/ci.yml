name: CI
on:
  push:
  pull_request:

jobs:
  build-test:
    # Xcode 16+ is needed for Swift Testing; macos-15 ships it.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
